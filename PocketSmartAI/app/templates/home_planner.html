{% extends "base.html" %}{% block title %}Home Planner{% endblock %}{% block content %}<div class="form-card"><span class="eyebrow">HOME INTERIOR</span><h1>Build a home budget</h1><form id="homeForm"><label>Budget (INR)<input name="budget" type="number" value="50000" min="1" required></label><label>Style<input name="style" value="modern" required></label><label>Location<input name="location"></label><label>Priorities<input name="priorities" value="lighting, storage"></label><div id="rooms"><div class="room row"><label>Room<select name="room_type"><option>Living Room</option><option>Bedroom</option><option>Kitchen</option></select></label><label>Qty<input name="quantity" type="number" min="1" value="1"></label><label>Items<input name="items" value="sofa, lighting, wall art"></label></div></div><button type="button" class="button secondary" onclick="addRoom()">+ Add room</button><button class="button">Generate recommendations</button></form></div><div id="result"></div>{% endblock %}{% block scripts %}<script src="/static/js/planners.js"></script><script>bindHomePlanner()</script>{% endblock %}
