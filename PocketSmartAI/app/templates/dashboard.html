{% extends "base.html" %}{% block title %}Dashboard{% endblock %}{% block content %}<div class="section-heading"><h1>Dashboard</h1><button class="button secondary" onclick="logout()">Logout</button></div><section class="grid three"><a class="card" href="/planner/home"><h2>🏠 Home</h2><p>Interior budget</p></a><a class="card" href="/planner/party"><h2>🎉 Party</h2><p>Event budget</p></a><a class="card" href="/planner/jewelry"><h2>💎 Jewelry</h2><p>Occasion styling</p></a></section><section class="card"><h2>Recent plans</h2><div id="recent">Loading…</div></section>{% endblock %}{% block scripts %}<script>(async()=>{let s=await api("/session-info");if(!s.ok){location.href="/login";return}let r=await (await api("/history")).json();document.getElementById("recent").innerHTML=r.length?r.slice(0,5).map(x=>`<div class="history-row"><a href="/history#${x.id}">${escapeHtml(x.title)}</a><b>₹${x.budget.toLocaleString("en-IN")}</b></div>`).join(""):"No plans yet."})()</script>{% endblock %}
